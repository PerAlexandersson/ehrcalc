[package]
name = "ehrcalc-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Model Context Protocol server for Ehrcalc"
readme = "README.md"

[[bin]]
name = "ehrcalc-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ehrcalc = { path = ".." }
num-bigint = "0.4"
num-rational = "0.4"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
