[package]
name = "ktt-search"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ehrcalc-foundations = { path = "../crates/ehrcalc-foundations" }
ehrcalc-kostka-engine = { path = "../crates/ehrcalc-kostka-engine" }
mysql = { version = "27.0.0", default-features = false, features = ["default-rust"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
