[package]
name = "ehrcalc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exact Ehrhart computations and related combinatorial counting tools"
readme = "README.md"
keywords = ["ehrhart", "combinatorics", "kostka", "hstar", "polytopes"]
categories = ["command-line-utilities", "mathematics", "science"]

[[bin]]
name = "ehrcalc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ehrcalc-foundations = { path = "crates/ehrcalc-foundations" }
ehrcalc-kostka-engine = { path = "crates/ehrcalc-kostka-engine" }
hashbrown = "0.15"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
polytool = { git = "https://github.com/PerAlexandersson/polytool.git", rev = "1656c87c2efaa777656f0643901f111e778d18fc" }
serde_json = "1"

[workspace]
members = [
    ".",
    "mcp",
    "crates/ehrcalc-foundations",
    "crates/ehrcalc-kostka-engine",
    "ktt-search",
]
resolver = "2"
