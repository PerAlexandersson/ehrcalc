[package]
name = "ehrcalc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exact Ehrhart computations and related combinatorial counting tools"
readme = "README.md"
keywords = ["ehrhart", "combinatorics", "kostka", "hstar", "polytopes"]
categories = ["command-line-utilities", "mathematics", "science"]

[[bin]]
name = "ehrcalc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
combinatoric-core = { path = "../combinatoric-core" }
kostka = { path = "../kostka" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde_json = "1"
